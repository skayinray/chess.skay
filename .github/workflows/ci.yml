name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag for the AppImage upload'
        required: true
        default: 'v1.0.0'

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest
        run: python -m pytest -q

  appimage:
    name: Slim AppImage release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest
        run: python -m pytest -q

      - name: Download appimagetool
        run: |
          curl -fsSL -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage

      - name: Build slim AppImage
        run: python tools/build_appimage.py /tmp/appimagetool.AppImage

      - name: Check size
        run: |
          size=$(stat -c %s chess.skay-x86_64.AppImage)
          echo "AppImage size: $size bytes"
          test "$size" -lt 62914560

      - name: Sign SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          python tools/sign_release.py sign chess.skay-x86_64.AppImage
          python tools/sign_release.py verify chess.skay-x86_64.AppImage chess.skay-x86_64.AppImage.sig
          mv SHA256SUMS SHA256SUMS-linux
          mv SHA256SUMS.sig SHA256SUMS-linux.sig
          python tools/sign_release.py verify SHA256SUMS-linux SHA256SUMS-linux.sig
          sha256sum -c SHA256SUMS-linux

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" \
            chess.skay-x86_64.AppImage \
            chess.skay-x86_64.AppImage.sig \
            SHA256SUMS-linux \
            SHA256SUMS-linux.sig \
            --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess.skay-x86_64-appimage
          path: |
            chess.skay-x86_64.AppImage
            chess.skay-x86_64.AppImage.sig
            SHA256SUMS-linux
            SHA256SUMS-linux.sig
