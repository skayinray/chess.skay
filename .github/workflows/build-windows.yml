name: Build Windows exe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Релиз, в который загрузить exe'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==6.12.0" "chess==1.11.2" pyinstaller pillow

      - name: Icon
        run: >-
          python -c "from PIL import Image;
          Image.open('src/resources/icon.png').save('icon.ico',
          sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: PyInstaller
        run: >-
          pyinstaller --noconfirm --clean --onefile --noconsole
          --name chess.skay-windows-x86_64
          --icon icon.ico
          --add-data "src/resources;resources"
          src/main.py

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$env:RELEASE_TAG" "dist/chess.skay-windows-x86_64.exe" --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess.skay-windows-x86_64
          path: dist/chess.skay-windows-x86_64.exe
